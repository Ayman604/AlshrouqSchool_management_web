<section class="admin-auth"><div class="admin-card"><div class="admin-badge"><i class="fa-solid fa-lock"></i> الإدارة</div><img src="/images/logo/AlshroukSchoolLogo.png" alt="شعار مدارس الشروق"><h1>نسيت كلمة المرور؟</h1>@if(success){<p class="alert-error">إذا كان البريد الإلكتروني مرتبطًا بحساب إدارة، فسيتم إرسال تعليمات إعادة تعيين كلمة المرور.</p><a routerLink="/admin/login" class="return-link">العودة لتسجيل الدخول</a>} @else {<p>أدخل بريدك الإلكتروني لإرسال رابط إعادة التعيين.</p><form [formGroup]="form" (ngSubmit)="send()"><label>البريد الإلكتروني<input class="form-control" type="email" formControlName="email"></label>@if(submitted&&form.invalid){<small class="error">أدخل بريدًا إلكترونيًا صحيحًا.</small>}<button class="admin-submit" [disabled]="loading">@if(loading){جارٍ الإرسال...} @else {إرسال رابط إعادة تعيين كلمة المرور}</button></form><a routerLink="/admin/login" class="return-link">العودة لتسجيل الدخول</a>}</div></section>
