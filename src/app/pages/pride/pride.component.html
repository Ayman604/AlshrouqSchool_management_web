<section class="page-section">
  <div class="container">
    <h1 class="page-title"><i class="fa-solid fa-user-graduate"></i>الإنجازات</h1>
    <p class="page-intro">نفخر بإنجازات طلابنا وتميزهم الأكاديمي وفي مختلف الأنشطة.</p>
    <div class="filters-bar">
      <label>
        <span>ترتيب حسب</span>
        <select (change)="onSortChange($event)" [disabled]="loading()">
          <option value="updatedAtUtc">التاريخ</option>
          <option value="title">العنوان</option>
        </select>
      </label>

      <label>
        <span>الاتجاه</span>
        <select (change)="onSortDirectionChange($event)" [disabled]="loading()">
          <option value="desc">تنازلي</option>
          <option value="asc">تصاعدي</option>
        </select>
      </label>
    </div>

    @if (loading()) {
    <app-content-skeleton [count]="pageSize()" variant="card" />
    } @else if (error()) {
    <div class="state-message state-error" role="alert">
      <i class="fa-solid fa-circle-exclamation"></i>
      {{ error() }}
    </div>
    } @else if (items().length === 0) {
    <div class="state-message state-empty">
      <i class="fa-solid fa-trophy"></i>
      <p>لا توجد إنجازات متاحة حالياً.</p>
    </div>
    } @else {
    <div class="pride-grid">
      @for (item of items(); track item.id) {
      <article class="pride-card">
        <a [routerLink]="['/pride', item.id]" class="pride-link">
          <div class="pride-image">
            <img [src]="mediaUrl(item.mediaAttachments?.[0]?.filePath)" [alt]="item.title" loading="lazy"
              (error)="onImageError($event)" />
          </div>

          <div class="pride-body">
            <h2>{{ item.title }}</h2>
          </div>
        </a>
      </article>
      }
    </div>

    <app-pagination [pageNumber]="pageNumber()" [totalPages]="totalPages()" [totalCount]="totalCount()"
      [pageSize]="pageSize()" [loading]="loading()" [pageSizeOptions]="[6,9, 12]" (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)" />
    }
  </div>
</section>
