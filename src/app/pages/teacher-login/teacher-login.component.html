<section class="auth-page"><div class="auth-card"><div class="auth-icon"><i class="fa-solid fa-chalkboard-user"></i></div><h1>بوابة المعلمين</h1><p>سجّل الدخول ببيانات البريد الإلكتروني وكلمة المرور التي أنشأها لك المدير.</p><form [formGroup]="form" (ngSubmit)="login()"><label>البريد الإلكتروني</label><input class="form-control" type="email" formControlName="email" placeholder="name@school.edu.sa"><label>كلمة المرور</label><input class="form-control" type="password" formControlName="password">@if(submitted&&form.invalid){<small class="error">يرجى إدخال بريد إلكتروني وكلمة مرور صالحين.</small>}<div class="auth-tools"><label><input type="checkbox" formControlName="remember"> تذكرني</label><button type="button" class="link-button" (click)="showForgot=!showForgot">هل نسيت كلمة المرور؟</button></div><button class="btn-primary" type="submit">دخول</button></form>@if(showForgot){<p class="notice">أدخل بريدك الإلكتروني المسجل وستصلك تعليمات إعادة تعيين كلمة المرور.</p>}<a routerLink="/" class="back">العودة إلى الموقع الرئيسي</a></div></section>
