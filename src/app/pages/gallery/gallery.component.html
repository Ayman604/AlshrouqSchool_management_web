<section class="page-section">
  <div class="container">
    <h1 class="page-title"><i class="fa-solid fa-photo-film"></i> معرض الصور والفيديو</h1>

    

    @if (loading()) {
      <app-content-skeleton [count]="pageSize()" variant="card" />
    } @else if (error()) {
      <div class="state-message state-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error() }}
      </div>
    } @else if (items().length === 0) {
      <div class="state-message state-empty">
        <i class="fa-solid fa-images"></i>
        <p>لا توجد وسائط في المعرض حالياً.</p>
      </div>
    } @else {
      <div class="gallery-grid">
        @for (item of items(); track item.id) {
          <button type="button" class="gallery-item" (click)="openPreview(item)">
            @if (item.type === 2) {
              <span class="media-type-badge"><i class="fa-solid fa-play"></i> فيديو</span>
            }
            <img
              [src]="item.filePath"
              [alt]="item.altText"
              loading="lazy"
              (error)="onImageError($event)"
            />
            <span class="gallery-caption">{{ item.fileName }}</span>
          </button>
        }
      </div>

      <app-pagination
        [pageNumber]="pageIndex()"
        [totalPages]="totalPages()"
        [totalCount]="totalCount()"
        [pageSize]="pageSize()"
        [loading]="loading()"
        [pageSizeOptions]="[8, 12, 16, 24]"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      />
    }
  </div>
</section>

@if (preview(); as active) {
  <div class="lightbox" role="dialog" aria-modal="true" (click)="closePreview()">
    <div class="lightbox-panel" (click)="$event.stopPropagation()">
      <button type="button" class="lightbox-close" (click)="closePreview()" aria-label="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h2>{{ active.fileName }}</h2>
      @if (active.type === 2) {
        <video controls [src]="active.filePath" class="lightbox-media"></video>
      } @else {
        <img
          [src]="active.filePath"
          [alt]="active.altText"
          class="lightbox-media"
          (error)="onImageError($event)"
        />
      }
    </div>
  </div>
}
