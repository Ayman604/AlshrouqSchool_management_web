<section class="page-section">
  <div class="container">
    <h1 class="page-title"><i class="fa-solid fa-bullhorn"></i> الأخبار والفعاليات</h1>

    <div class="filters-bar">
      <label>
  <span>ترتيب حسب</span>
  <select (change)="onSortChange($event)" [disabled]="loading()">
    <option value="createdAt">التاريخ</option>
    <option value="title">العنوان</option>
  </select>
</label>

<label>
  <span>الاتجاه</span>
  <select (change)="onSortDirectionChange($event)" [disabled]="loading()">
    <option value="desc">تنازلي</option>
    <option value="asc">تصاعدي</option>
  </select>
</label>
      <!-- <label>
        <span>النوع</span>
        <select (change)="onContentTypeChange($event)" [disabled]="loading()">
          <option value="">الكل</option>
          <option value="News">أخبار</option>
          <option value="Event">فعاليات</option>
        </select>
      </label>
      <label>
        <span>التصنيف</span>
        <select (change)="onCategoryChange($event)" [disabled]="loading()">
          <option value="">جميع التصنيفات</option>
          <option value="announcements">إعلانات</option>
          <option value="activities">أنشطة</option>
          <option value="academic">أكاديمي</option>
        </select>
      </label> -->
    </div>

    @if (loading()) {
      <app-content-skeleton [count]="pageSize()" variant="card" />
    } @else if (error()) {
      <div class="state-message state-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error() }}
      </div>
    } @else if (items().length === 0) {
      <div class="state-message state-empty">
        <i class="fa-solid fa-newspaper"></i>
        <p>لا توجد أخبار أو فعاليات متاحة حالياً.</p>
      </div>
    } @else {
      <div class="news-grid">
        @for (item of items(); track item.id) {
          <article class="news-card">
            <a [routerLink]="['/news', item.id]" class="news-card-link">
              <div class="news-cover">
                <!-- <img
                  [src]="mediaUrl(item.coverImageUrl)"
                  [alt]="item.title"
                  loading="lazy"
                  (error)="onImageError($event)"
                /> -->
    
                <!-- @if (item.type === 'Event') {
                  <span class="news-badge">فعالية</span>
                } -->

                <img
                  [src]="mediaUrl(item.mediaAttachments?.[0]?.filePath)"
                  [alt]="item.title"
                  loading="lazy"
                  (error)="onImageError($event)"
                />              
              </div>
              <div class="news-card-body">
                <h2 class="news-title">{{ item.title }}</h2>
              </div>
            </a>
          </article>
        }
      </div>

      <app-pagination
        [pageNumber]="pageNumber()"
        [totalPages]="totalPages()"
        [totalCount]="totalCount()"
        [pageSize]="pageSize()"
        [loading]="loading()"
        [pageSizeOptions]="[6, 9, 12]"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      />
    }
  </div>
</section>
