<section class="page-section">
  <div class="container detail-container">
    <a routerLink="/news" class="back-link"><i class="fa-solid fa-arrow-right"></i> العودة للأخبار</a>

    @if (loading()) {
      <app-content-skeleton [count]="1" variant="list" />
    } @else if (error()) {
      <div class="state-error" role="alert">{{ error() }}</div>
    } @else if (item(); as news) {

<article class="detail-card">
    <div class="detail-body">
      <h1>{{ news.title }}</h1>

      <time [attr.datetime]="news.createdAtUtc">
        {{ news.createdAtUtc | date: 'fullDate' : '' : 'ar' }}
      </time>

      <div class="detail-media">
        @for (media of news.mediaAttachments; track media.mediaId) {
          <img
            [src]="mediaUrl(media.filePath)"
            [alt]="media.altText || news.title"
            (error)="onImageError($event)"
          />
        }
      </div>

      <div class="detail-content">
        {{ cleanContent(news.content, news.title) }}
      </div>
    </div>
  </article>

    }
  </div>
</section>
