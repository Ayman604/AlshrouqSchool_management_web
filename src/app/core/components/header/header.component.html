<header class="site-header">
  <!-- Main Navigation -->
  <nav class="main-nav navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
        <span class="logo-icon"><img src="/images/logo/AlshroukSchoolLogo.png" alt="شعار المدرسة"/></span>
        <span class="logo-text">
          <strong>مدارس الشروق</strong>
          <small>النموذجية</small>
        </span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="فتح القائمة"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto gap-1">
          @for (link of activeLinks; track link.path) {
            <li class="nav-item">
              <a
                class="nav-link"
                [routerLink]="link.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
        @if (portal === 'public') {
          <div class="register-menu">
            <button type="button" class="btn-register border-0" (click)="registerMenuOpen = !registerMenuOpen">سجّل الآن <i class="fa-solid fa-chevron-down"></i></button>
            @if (registerMenuOpen) {
              <div class="register-options">
                <a routerLink="/register">تسجيل طالب</a>
                <a routerLink="/teacher-login">دخول معلم</a>
              </div>
            }
          </div>
        } @else {
          <div class="portal-actions">
            <span class="welcome">
              <span class="avatar">
                <i class="fa-solid fa-user"></i>
              </span> مرحباً، {{ portal === 'teacher' ? 'أ. أحمد محمد' : 'الطالب محمد أحمد' }}</span>
            <a routerLink="/" class="btn-home">العودة إلى الرئيسية</a>
            <button type="button" class="btn-logout" (click)="logout()">تسجيل الخروج</button>
          </div>
        }
      </div>
    </div>
  </nav>
</header>
